<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IMnexus — Sign in</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      -webkit-font-smoothing: antialiased;
      color: #09090b;
    }

    /* Brand mark: IM bold + nexus regular lowercase */
    .brand {
      font-size: 15px;
      letter-spacing: 0.02em;
      user-select: none;
    }
    .brand .im {
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .brand .nexus {
      font-weight: 400;
      text-transform: lowercase;
      letter-spacing: 0.01em;
    }

    /* LEFT: brand image panel */
    .visual {
      flex: 1.15;
      position: relative;
      background: #3061d0 url("https://images.unsplash.com/photo-1656932850123-dbd64a854816?q=80&w=1600&auto=format&fit=crop") center center / cover no-repeat;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 32px 36px;
      color: #fff;
    }
    .visual::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(9,9,11,0.35) 0%, transparent 45%);
      pointer-events: none;
    }
    .visual .top,
    .visual .bottom {
      position: relative;
      z-index: 1;
    }
    .visual .tagline {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
      max-width: 340px;
      text-shadow: 0 1px 12px rgba(0,0,0,0.25);
    }
    .visual .meta {
      font-size: 12px;
      font-weight: 500;
      opacity: 0.85;
      margin-top: 10px;
    }

    /* RIGHT: login card */
    .panel {
      width: 440px;
      flex-shrink: 0;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px 52px;
    }
    .panel-inner {
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
    }
    .panel .brand {
      margin-bottom: 36px;
      font-size: 18px;
      color: #09090b;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      line-height: 1.15;
    }
    .sub {
      font-size: 14px;
      color: #71717a;
      font-weight: 500;
      margin-bottom: 32px;
      line-height: 1.45;
    }

    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #3f3f46;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #e4e4e7;
      border-radius: 8px;
      background: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      color: #09090b;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus {
      border-color: #3061d0;
      box-shadow: 0 0 0 3px rgba(48, 97, 208, 0.15);
    }
    .field input::placeholder { color: #a1a1aa; font-weight: 400; }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: 13px;
    }
    .row label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #52525b;
      font-weight: 500;
      cursor: pointer;
    }
    .row input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: #3061d0;
    }
    .row a {
      color: #3061d0;
      font-weight: 600;
      text-decoration: none;
    }
    .row a:hover { text-decoration: underline; }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: #3061d0;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:hover { opacity: 0.92; }
    .btn:active { transform: scale(0.99); }

    .footer-note {
      margin-top: 28px;
      font-size: 12px;
      color: #a1a1aa;
      text-align: center;
      line-height: 1.5;
    }
    .footer-note a {
      color: #71717a;
      font-weight: 600;
      text-decoration: none;
    }

    @media (max-width: 860px) {
      body { flex-direction: column; }
      .visual {
        min-height: 220px;
        flex: none;
        padding: 24px;
      }
      .visual .tagline { font-size: 20px; max-width: none; }
      .panel {
        width: 100%;
        flex: 1;
        padding: 36px 28px;
      }
    }
  </style>
</head>
<body>

  <div class="visual">
    <div class="top">
      <div class="brand" style="color:#fff;">
        <span class="im">IM</span><span class="nexus">nexus</span>
      </div>
    </div>
    <div class="bottom">
      <div class="tagline">Your cases,<br>in continuity.</div>
      <div class="meta">Private console · Public archive</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-inner">
      <div class="brand">
        <span class="im">IM</span><span class="nexus">nexus</span>
      </div>

      <h1>Welcome back</h1>
      <p class="sub">Sign in to access your dashboard, manage case dossiers, and control what appears on the public archive.</p>

      <form action="imnexus-app.html" method="get" onsubmit="return true;">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" type="email" name="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required />
        </div>
        <div class="row">
          <label><input type="checkbox" name="remember" /> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>
        <button type="submit" class="btn">Sign in to console</button>
      </form>

      <p class="footer-note">
        Authorized access only.<br>
        <a href="imnexus-app.html">Continue as demo →</a>
      </p>
    </div>
  </div>

</body>
</html>
